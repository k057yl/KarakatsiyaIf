<div class="categories-manager">
  <h3>Управление категориями афиши 📂</h3>

  <form [formGroup]="categoryForm" (ngSubmit)="onCreate()" class="category-form">
    <div class="input-group">
      <input formControlName="name" placeholder="Название (например: Рейв, Выставка)" />
    </div>

    <div class="input-group">
      <select formControlName="icon" class="icon-select">
        <option value="" disabled selected>Выбери иконку...</option>
        @for (icon of availableIcons; track icon.value) {
          <option [value]="icon.value">{{ icon.label }} {{ icon.value }}</option>
        }
      </select>
    </div>

    <button type="submit" [disabled]="categoryForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Создание...' : 'Добавить' }}
    </button>
  </form>

  @if (isLoading()) {
    <p class="loading-text">Загрузка категорий...</p>
  } @else {
    <div class="categories-list">
      @for (cat of categories(); track cat.id) {
        <div class="category-item">
          <span class="cat-name">
            <span class="cat-icon">{{ getIconLabel(cat.icon) }}</span> 
            {{ cat.name }} 
            <small class="slug-text">({{ cat.slug }})</small>
          </span>
          <button class="btn-delete" (click)="onDelete(cat.id)">Удалить</button>
        </div>
      } @empty {
        <p class="empty-text">Категорий пока нет. Создай первую!</p>
      }
    </div>
  }
</div>
