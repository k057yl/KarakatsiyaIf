<div class="modal-backdrop" (click)="close()">
  <div class="modal-window" (click)="$event.stopPropagation()">
    
    @if (!createdEventId()) {
      <header>
        <h3>Создать событие 🎸</h3>
        <button class="close-x" (click)="close()">×</button>
      </header>

      <form [formGroup]="eventForm" (ngSubmit)="submit()">
        <div class="field">
          <label>Название</label>
          <input formControlName="title" placeholder="Крутая рейв-туса" />
        </div>

        <div class="field">
          <label>Описание</label>
          <textarea formControlName="description" rows="3"></textarea>
        </div>

        <div class="field">
          <label>Дата начала</label>
          <input type="datetime-local" formControlName="startDate" />
        </div>

        <div class="divider"><span>Где это будет?</span></div>

        <div class="field">
          <label>Ткни на карту или перетащи маркер 📍</label>
          <div id="event-map" class="leaflet-map-container"></div>
        </div>

        <div class="field">
          <input formControlName="locationName" placeholder="Название места (Клуб Atlas)" />
        </div>

        <div class="field-row">
          <input formControlName="city" placeholder="Город" />
          <input formControlName="street" placeholder="Улица" />
          <input formControlNumber="houseNumber" placeholder="Дом" class="small" />
        </div>

        <div class="actions">
          <button type="button" class="btn-secondary" (click)="close()">Отмена</button>
          <button type="submit" class="btn-primary" [disabled]="eventForm.invalid || isSubmitting()">
            {{ isSubmitting() ? 'Отправка...' : 'Создать событие' }}
          </button>
        </div>
      </form>
    } 
    
    @else {
      <header>
        <h3>Успешно создано! 🎉</h3>
        <button class="close-x" (click)="close()">×</button>
      </header>
      
      <div class="vip-upsell-body" style="padding: 20px; text-align: center;">
        <p style="font-size: 1.1rem; margin-bottom: 20px;">
          Твое мероприятие успешно отправлено на модерацию.
        </p>
        <div class="vip-promo-box" style="background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
          <h4 style="color: #ffd700; margin: 0 0 10px 0; font-size: 1.2rem;">💎 Закрепить в VIP-ленте?</h4>
          <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);">
            Выведи событие в топ сайта прямо под картой. Стоимость: <strong>500 UAH</strong>.
          </p>
        </div>
        
        <div class="actions" style="display: flex; gap: 15px; justify-content: center;">
          <button type="button" class="btn-secondary" (click)="finishWithoutVip()">Оставить обычным</button>
          <button type="button" class="btn-vip-pay" (click)="buyVip()" style="background: linear-gradient(45deg, #ffd700, #ffaa00); color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            💳 Оплатить VIP
          </button>
        </div>
      </div>
    }

  </div>
</div>
