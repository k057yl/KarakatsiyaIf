<div class="modal-backdrop" (click)="close()">
  <div class="modal-window" (click)="$event.stopPropagation()">
    
    @if (!isSuccessScreen()) {
      <header>
        <h3>{{ 'EVENT_MODAL.TITLE_CREATE' | translate }}</h3>
        <button class="close-x" (click)="close()">×</button>
      </header>

      <app-event-form
        [isEditMode]="false"
        [categoriesList]="categoriesList()"
        [isSubmitting]="isSubmitting()"
        [isUploadingPhoto]="isUploadingPhoto()"
        (formSubmit)="onCreateSubmit($event)"
        (cancel)="close()">
      </app-event-form>
    } @else {
      <header>
        <h3>{{ 'EVENT_MODAL.SUCCESS_TITLE' | translate }}</h3>
        <button class="close-x" (click)="close()">×</button>
      </header>
      
      <div class="vip-upsell-body" style="padding: 20px; text-align: center;">
        <p style="font-size: 1.1rem; margin-bottom: 20px;">
          {{ 'EVENT_MODAL.SUCCESS_DESC' | translate }}
        </p>
        <div class="vip-promo-box" style="background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
          <h4 style="color: #ffd700; margin: 0 0 10px 0; font-size: 1.2rem;">{{ 'EVENT_MODAL.VIP_PROMO_TITLE' | translate }}</h4>
          <p style="margin: 0; font-size: 0.9rem; color: var(--text-muted);" [innerHTML]="'EVENT_MODAL.VIP_PROMO_DESC' | translate"></p>
        </div>
        
        <div class="actions" style="display: flex; gap: 15px; justify-content: center;">
          <button type="button" class="btn-secondary" (click)="finishWithoutVip()">{{ 'EVENT_MODAL.KEEP_NORMAL_BTN' | translate }}</button>
          <button type="button" class="btn-vip-pay" (click)="buyVip()" style="background: linear-gradient(45deg, #ffd700, #ffaa00); color: #000; font-weight: bold; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            {{ 'EVENT_MODAL.PAY_VIP_BTN' | translate }}
          </button>
        </div>
      </div>
    }

  </div>
</div>
