<app-main-header 
  [currentTheme]="currentTheme"
  (languageChanged)="onLanguageChanged($event)"
  (themeToggled)="onThemeToggled()">
</app-main-header>

@if (isEventsPage()) {
  <app-events-dashboard-sub-header 
    [currentSort]="activeHubComponent ? activeHubComponent.currentSort() : 'date'"
    (sortChanged)="onSortChanged($event)">
  </app-events-dashboard-sub-header>
}

<main class="main-content">
  <router-outlet (activate)="onRouteActivated($event)"></router-outlet>
</main>

<app-main-footer></app-main-footer>
