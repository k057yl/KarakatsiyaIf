<header class="main-header">
  <div class="container">
    <a routerLink="/" class="logo">Showcase</a>
    
    <nav class="main-nav">
      <a routerLink="/events" routerLinkActive="active">Афиша</a>

      <div class="auth-buttons">
        @if (authService.currentUser$ | async; as user) {
          @if (user.role === 'SuperAdmin') {
            <a routerLink="/admin/pending" 
               class="btn-admin" 
               routerLinkActive="active">
               👑 Админка
            </a>
          }
          <span class="user-email">{{ user.email }}</span>
          <button (click)="logout()" class="btn-outline">Выйти</button>
        } @else {
          <a routerLink="/auth/login" class="btn-link">Вход</a>
          <a routerLink="/auth/register" class="btn-primary">Регистрация</a>
        }
      </div>
    </nav>
  </div>
</header>

<main class="main-content">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="main-footer">
  <div class="container">
    <p>&copy; 2026 Showcase Project. Created with hate & Angular.</p>
  </div>
</footer>
